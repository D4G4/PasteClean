<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PasteClean — Canvas</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      background: #f4f4f5;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="onboarding.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    // Minimal phone shell — mirrors PhoneFrame from app.jsx.
    function MiniPhone({ children, dark = false, sbDark }) {
      const sb = sbDark != null ? sbDark : dark;
      return (
        <div style={{
          width: 402, height: 874, borderRadius: 48, overflow: 'hidden',
          position: 'relative', background: dark ? '#000' : '#fff',
          boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
          fontFamily: '-apple-system, system-ui, sans-serif',
        }}>
          <div style={{
            position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
            width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
          }} />
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
            <IOSStatusBar dark={sb} />
          </div>
          <div style={{ position: 'absolute', inset: 0 }}>{children}</div>
          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
            height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
            paddingBottom: 8, pointerEvents: 'none',
          }}>
            <div style={{
              width: 139, height: 5, borderRadius: 100,
              background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
            }} />
          </div>
        </div>
      );
    }

    // Static tab bar — lifted from app.jsx for canvas display.
    function MiniTabBar({ tab, dark, accent }) {
      const inactive = dark ? 'rgba(235,235,245,0.45)' : 'rgba(60,60,67,0.55)';
      const bg = dark ? 'rgba(28,28,30,0.85)' : 'rgba(255,255,255,0.85)';
      const sep = dark ? 'rgba(84,84,88,0.5)' : 'rgba(60,60,67,0.18)';
      const tabs = [
        { id: 'editor', label: 'Editor', icon: 'pencil' },
        { id: 'templates', label: 'Templates', icon: 'bookmark' },
        { id: 'settings', label: 'Settings', icon: 'gear' },
      ];
      return (
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 40,
          paddingBottom: 28, paddingTop: 8, background: bg,
          backdropFilter: 'blur(20px) saturate(180%)',
          WebkitBackdropFilter: 'blur(20px) saturate(180%)',
          borderTop: `0.5px solid ${sep}`, display: 'flex',
        }}>
          {tabs.map((tb) => {
            const active = tab === tb.id;
            const color = active ? accent : inactive;
            return (
              <div key={tb.id} style={{
                flex: 1, height: 50, display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center', gap: 3,
              }}>
                {tb.icon === 'pencil' && Icon.pencil(color)}
                {tb.icon === 'bookmark' && Icon.bookmark(color, active)}
                {tb.icon === 'gear' && Icon.gear(color)}
                <div style={{ fontSize: 10, fontWeight: 500, color, letterSpacing: 0.1 }}>
                  {tb.label}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    const ACCENT = '#FF6B5C';

    // Static mock of the live GmailHandoffToast in app.jsx — canvas display only.
    function GmailToastMock({ accent, dark, alwaysOpen }) {
      const fg = dark ? '#fff' : '#1c1c1e';
      const muted = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
      const bg = dark ? 'rgba(44,44,46,0.96)' : 'rgba(255,255,255,0.98)';
      const sep = dark ? 'rgba(84,84,88,0.5)' : 'rgba(60,60,67,0.16)';
      return (
        <div style={{
          position: 'absolute', left: 12, right: 12, bottom: 28, zIndex: 80,
          borderRadius: 18, background: bg,
          boxShadow: '0 16px 40px rgba(0,0,0,0.22), 0 0 0 0.5px rgba(0,0,0,0.08)',
          border: `0.5px solid ${sep}`, padding: '14px 14px 12px',
          fontFamily: '-apple-system, "SF Pro Text", system-ui',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{
              width: 32, height: 32, borderRadius: 16, background: '#34c75922',
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
            }}>
              <svg width="16" height="13" viewBox="0 0 11 9"><path d="M1 4.5l3 3 6-6" stroke="#34c759" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: fg, letterSpacing: -0.2 }}>Copied — open Gmail?</div>
              <div style={{ fontSize: 12.5, color: muted, letterSpacing: -0.1 }}>Paste your sanitized email in the compose window.</div>
            </div>
            <div style={{ width: 28, height: 28, borderRadius: 14, display: 'flex', alignItems: 'center', justifyContent: 'center', color: muted }}>
              <svg width="11" height="11" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
            <div style={{
              flex: 1, height: 38, borderRadius: 10,
              background: dark ? 'rgba(120,120,128,0.24)' : 'rgba(120,120,128,0.16)',
              color: fg, fontSize: 14, fontWeight: 600, letterSpacing: -0.2,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>Not now</div>
            <div style={{
              flex: 1.4, height: 38, borderRadius: 10, background: accent, color: '#fff',
              fontSize: 14, fontWeight: 600, letterSpacing: -0.2,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
            }}>
              Open Gmail
              <svg width="11" height="11" viewBox="0 0 12 12"><path d="M3 1h7v7M10 1L1 10" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinecap="round"/></svg>
            </div>
          </div>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 8,
            marginTop: 10, paddingTop: 10, borderTop: `0.5px solid ${sep}`,
          }}>
            <div style={{
              width: 18, height: 18, borderRadius: 5,
              background: alwaysOpen ? accent : 'transparent',
              border: `1.5px solid ${alwaysOpen ? accent : muted}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
            }}>
              {alwaysOpen && (
                <svg width="10" height="8" viewBox="0 0 11 9"><path d="M1 4.5l3 3 6-6" stroke="#fff" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
              )}
            </div>
            <span style={{ fontSize: 12.5, color: fg, letterSpacing: -0.1 }}>Always copy + open Gmail</span>
          </div>
        </div>
      );
    }

    // Developer-facing notes card — describes the transitions for handoff.
    function DevNotes({ accent }) {
      const Item = ({ n, title, body }) => (
        <div style={{ display: 'flex', gap: 12, marginBottom: 14 }}>
          <div style={{
            width: 22, height: 22, borderRadius: 11, background: accent, color: '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 12, fontWeight: 700, flexShrink: 0,
          }}>{n}</div>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#1c1c1e', letterSpacing: -0.2, marginBottom: 2 }}>{title}</div>
            <div style={{ fontSize: 12, color: '#3c3c43cc', lineHeight: 1.45, letterSpacing: -0.1 }}>{body}</div>
          </div>
        </div>
      );
      return (
        <div style={{
          width: 402, height: 874, background: '#fff', boxSizing: 'border-box',
          padding: '32px 24px', fontFamily: '-apple-system, "SF Pro Text", system-ui',
          borderRadius: 16, boxShadow: '0 20px 60px rgba(0,0,0,0.10)',
          overflow: 'auto',
        }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.8, color: accent, marginBottom: 4 }}>DEV NOTES</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: '#1c1c1e', letterSpacing: -0.4, marginBottom: 18 }}>Copy → Gmail handoff</div>

          <Item n="1" title="User taps Copy"
            body="Editor (or PreviewModal) calls doCopy(). Write sanitized HTML + plaintext fallback to the clipboard via ClipboardItem. Flip the button label to 'Copied!' for 1600ms." />
          <Item n="2" title="Read user preference"
            body="If TWEAK_DEFAULTS.alwaysOpenGmail === true, skip the toast and jump straight to step 5. Otherwise show the handoff toast." />
          <Item n="3" title="Show handoff toast"
            body="Slide up from the bottom of the phone shell (translateY 110% → 0, cubic-bezier(0.22,1,0.36,1), 280ms). z-index above tab bar. Auto-dismiss after 6s." />
          <Item n="4" title="User taps 'Open Gmail'"
            body="Dismiss toast (slide down + fade). Deeplink: googlegmail://co?subject=&body=… (iOS) or intent://compose#Intent;package=com.google.android.gm (Android). Body is empty — user pastes from clipboard." />
          <Item n="5" title="Persist 'Always' choice"
            body="If the checkbox is ticked, write alwaysOpenGmail=true via setTweak. From then on, Copy launches Gmail without showing the toast. Surface a one-line undo banner in Settings → Defaults." />
          <Item n="6" title="If clipboard write fails"
            body="navigator.clipboard.write throws on non-secure contexts. Fall back to writeText with plain content and show the toast title as 'Copied as plain text' (warning variant — yellow check)." />

          <div style={{
            marginTop: 6, padding: '10px 12px', borderRadius: 10,
            background: '#f2f2f7', fontSize: 11.5, color: '#3c3c43cc', lineHeight: 1.45,
          }}>
            <b style={{color:'#1c1c1e'}}>Edge case:</b> iOS 17+ requires user gesture for googlegmail:// — keep the deeplink inside the same tap handler that triggered doCopy.
          </div>
        </div>
      );
    }
    const SAMPLE = `<h1 style="color:#fff">Q2 launch recap</h1>
<p>Hi Sam,</p>
<p>Quick recap from this morning's sync —</p>
<ul>
  <li><b>Beta signups:</b> <span style="color:#0a8a45">247</span></li>
  <li><b>Blocker:</b> <span style="color:#c2410c">auth on Android</span></li>
  <li><b>Ship date:</b> <span style="color:#0a8a45">May 28</span></li>
</ul>
<p>— Alex</p>`;
    const ONB_SCREENS = [
      { id: 's0', label: '1 · Problem', page: 0 },
      { id: 's1', label: '2 · How',     page: 1 },
      { id: 's2', label: '3 · Preview', page: 2 },
      { id: 's3', label: '4 · Flow',    page: 3 },
      { id: 's4', label: '5 · Theme',   page: 4 },
    ];

    // Stub state holders so screens render without parent App.
    function EditorWrap({ dark, composeFields }) {
      const [content, setContent] = React.useState(SAMPLE);
      const [toAddr, setToAddr] = React.useState('sam@example.com');
      const [subject, setSubject] = React.useState('Q2 launch recap');
      return (
        <EditorScreen dark={dark} accent={ACCENT}
          content={content} setContent={setContent}
          toAddr={toAddr} setToAddr={setToAddr}
          subject={subject} setSubject={setSubject}
          composeFields={composeFields}
          onCopy={() => {}} copied={false}
          onOpenPreview={() => {}} />
      );
    }

    function SettingsWrap({ dark }) {
      const [fs, setFs] = React.useState(15);
      const [tc, setTc] = React.useState('#1c1c1e');
      return (
        <SettingsScreen dark={dark} accent={ACCENT}
          fontSize={fs} setFontSize={setFs}
          textColor={tc} setTextColor={setTc} />
      );
    }

    function Canvas() {
      return (
        <DesignCanvas title="PasteClean — all screens">
          <DCSection id="onb" title="Onboarding">
            {ONB_SCREENS.map((s) => (
              <DCArtboard key={s.id} id={s.id} label={s.label} width={402} height={874}>
                <MiniPhone>
                  <Onboarding accent={ACCENT} setAccent={() => {}} onDone={() => {}} initialPage={s.page} />
                </MiniPhone>
              </DCArtboard>
            ))}
          </DCSection>

          <DCSection id="editor" title="Editor">
            <DCArtboard id="ed-light" label="Editor · Light" width={402} height={874}>
              <MiniPhone sbDark={true}>
                <EditorWrap dark={false} composeFields={true} />
              </MiniPhone>
            </DCArtboard>
            <DCArtboard id="ed-dark" label="Editor · Dark" width={402} height={874}>
              <MiniPhone dark={true}>
                <EditorWrap dark={true} composeFields={true} />
              </MiniPhone>
            </DCArtboard>
            <DCArtboard id="ed-clean" label="Editor · Focus mode" width={402} height={874}>
              <MiniPhone sbDark={true}>
                <EditorWrap dark={false} composeFields={false} />
              </MiniPhone>
            </DCArtboard>
          </DCSection>

          <DCSection id="preview" title="Gmail Preview">
            <DCArtboard id="prev-safe" label="Gmail Safe (sanitized)" width={402} height={874}>
              <MiniPhone>
                <div style={{ position: 'absolute', inset: 0 }}>
                  <EditorWrap dark={false} composeFields={true} />
                </div>
                <PreviewModal open={true} onClose={() => {}}
                  content={SAMPLE} dark={false} accent={ACCENT}
                  onCopy={() => {}} copied={false} />
              </MiniPhone>
            </DCArtboard>
          </DCSection>

          <DCSection id="handoff" title="Copy → Gmail handoff">
            <DCArtboard id="toast" label="Gmail handoff toast" width={402} height={874}>
              <MiniPhone sbDark={true}>
                <EditorWrap dark={false} composeFields={true} />
                <GmailToastMock accent={ACCENT} dark={false} alwaysOpen={false} />
              </MiniPhone>
            </DCArtboard>
            <DCArtboard id="toast-opted" label="Toast — opted in" width={402} height={874}>
              <MiniPhone sbDark={true}>
                <EditorWrap dark={false} composeFields={true} />
                <GmailToastMock accent={ACCENT} dark={false} alwaysOpen={true} />
              </MiniPhone>
            </DCArtboard>
            <DCArtboard id="dev-notes" label="Dev notes — transitions" width={402} height={874}>
              <DevNotes accent={ACCENT} />
            </DCArtboard>
          </DCSection>

          <DCSection id="tmpl" title="Templates">
            <DCArtboard id="tmpl-empty" label="Empty state" width={402} height={874}>
              <MiniPhone>
                <TemplatesScreen dark={false} accent={ACCENT} populated={false} />
                <MiniTabBar tab="templates" dark={false} accent={ACCENT} />
              </MiniPhone>
            </DCArtboard>
            <DCArtboard id="tmpl-full" label="Populated" width={402} height={874}>
              <MiniPhone>
                <TemplatesScreen dark={false} accent={ACCENT} populated={true} />
                <MiniTabBar tab="templates" dark={false} accent={ACCENT} />
              </MiniPhone>
            </DCArtboard>
          </DCSection>

          <DCSection id="settings" title="Settings">
            <DCArtboard id="set-light" label="Light" width={402} height={874}>
              <MiniPhone>
                <SettingsWrap dark={false} />
                <MiniTabBar tab="settings" dark={false} accent={ACCENT} />
              </MiniPhone>
            </DCArtboard>
            <DCArtboard id="set-dark" label="Dark" width={402} height={874}>
              <MiniPhone dark={true}>
                <SettingsWrap dark={true} />
                <MiniTabBar tab="settings" dark={true} accent={ACCENT} />
              </MiniPhone>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Canvas />);
  </script>
</body>
</html>
