# Toolbar visibility regression test.
#
# This is the test that would have caught the bug we shipped on 2026-05-15:
# the formatting toolbar (above the keyboard) was rendered but hidden behind
# the keyboard, because the KeyboardAvoidingView wrapping it was mounted
# conditionally on `keyboardVisible`. KAV's UIKeyboardWillShow listener
# attaches at mount time, so when KAV mounted AFTER the keyboard's show
# event fired, it never saw the event and applied no inset.
#
# Fix in code: KAV is now always mounted; only the toolbar contents render
# conditionally. This flow guards against a future refactor reverting that.
#
# Specifically asserts:
#   - tapping into the editor brings up the keyboard
#   - the keyboard-dismiss button (testID="toolbar-dismiss-keyboard") is
#     visible — proves the toolbar bar is on screen, not behind the keyboard
#   - tapping the dismiss button hides the keyboard
appId: com.pasteclean.app
tags:
  - regression
  - toolbar
---
- launchApp

- runFlow:
    when:
      visible:
        id: "onboarding-page-0"
    file: 01_onboarding_to_editor.yaml

- tapOn:
    id: "editor-body"
- waitForAnimationToEnd:
    timeout: 2000

# The exact assertion that would have failed yesterday:
- assertVisible:
    id: "toolbar-dismiss-keyboard"

# Dismiss button actually works.
- tapOn:
    id: "toolbar-dismiss-keyboard"
- waitForAnimationToEnd:
    timeout: 1000

# After dismiss, the toolbar should no longer be on screen.
- assertNotVisible:
    id: "toolbar-dismiss-keyboard"
