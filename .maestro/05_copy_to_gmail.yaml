# Copy-for-Gmail handoff: full happy path from typing to the post-copy toast.
# Unit tests cover the sanitize → clipboard → toast wiring; this flow proves
# the same path works against the real WebView's getHTML() round-trip.
appId: com.pasteclean.app
tags:
  - smoke
  - copy
---
# Clear state so autoOpenGmail starts false (otherwise a stale AsyncStorage
# value from a previous run can flip the post-copy flow to "open Gmail
# directly" and the toast never appears — breaking the assertion).
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    when:
      visible:
        id: "onboarding-page-0"
    file: 01_onboarding_to_editor.yaml

- tapOn:
    id: "editor-body"
- waitForAnimationToEnd:
    timeout: 2000

- inputText: "Hey team — quick status: shipping by Friday."

- tapOn:
    id: "copy-button"

# Give copyForGmail's async chain (getHTML + sanitize + native clipboard
# write + setCopied + show toast) time to settle before reading the
# accessibility tree.
- waitForAnimationToEnd:
    timeout: 1500

# The Copy button's accessibilityLabel flips from "Copy to Gmail" to
# "Copied" when copied=true. (The visible text "Copied!" is grouped under
# the TouchableOpacity's accessibility node, not surfaced separately —
# Maestro only sees the label.)
- assertVisible: "Copied"

# The toast appears when autoOpenGmail is false (which clearState above
# guarantees on first run).
- assertVisible: "Copied — open Gmail?"
- assertVisible: "Open Gmail"

- takeScreenshot: copy-success-toast
