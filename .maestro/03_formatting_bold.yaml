# Bold-toggle round-trip: type plain, turn bold on, type bold, turn bold off,
# type plain again. We can't directly assert "this text is bold" without an
# OCR step, but we CAN verify:
#   - all the typed text appears
#   - the Copy flow then captures both the bold and the surrounding text
#
# Bold/italic/underline/strike share the same TenTap toolbar-item shape, so a
# regression in one means a regression in all — we cover bold here as the
# canary; if it works the rest do too.
#
# Toolbar buttons in TenTap don't expose stable testIDs; we target by their
# accessibility text rendered into the FlatList. "B" is the bold glyph
# Maestro can match on the iOS accessibility tree.
appId: com.pasteclean.app
tags:
  - formatting
---
- launchApp

- runFlow:
    when:
      visible:
        id: "onboarding-page-0"
    file: 01_onboarding_to_editor.yaml

- tapOn:
    id: "editor-body"
- waitForAnimationToEnd:
    timeout: 2000

- inputText: "Plain "

# Toggle bold ON (the "B" toolbar button).
- tapOn: "B"
- inputText: "BOLD"
# Toggle bold OFF.
- tapOn: "B"
- inputText: " plain again"

# Substring/regex assertions — iOS predictive text can prepend suggestions
# when Maestro types key-by-key, so we match anywhere in the surrounding
# accessibility text rather than the exact strings.
- assertVisible: ".*Plain.*"
- assertVisible: ".*BOLD.*"
- assertVisible: ".*plain again.*"

# Copy and confirm the sanitized payload made it out. The Copy button's
# accessibilityLabel flips from "Copy to Gmail" to "Copied" — Maestro
# sees the label, not the literal "Copied!" text node (which is grouped
# under the TouchableOpacity's accessibility node).
- tapOn:
    id: "copy-button"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible: "Copied"
