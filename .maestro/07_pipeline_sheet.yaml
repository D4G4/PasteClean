# "How It Works" sheet — opens via Settings, renders as a native iOS
# formSheet (UISheetPresentationController), dismisses via close button
# OR by swiping down. This flow exists because v1.1.6 shipped a sheet
# that crashed on scroll-inside (gorhom + reanimated worklet) and the
# previous version of this flow didn't exercise the scroll gesture.
#
# Coverage that was MISSING before this rewrite:
#   - scroll inside the sheet body (the gesture that crashed)
#   - swipe down to dismiss (the native iOS dismissal)
# Both are now asserted below.
appId: com.pasteclean.app
tags:
  - smoke
  - sheet
---
- launchApp

# If we land on onboarding, walk through.
- runFlow:
    when:
      visible:
        id: "onboarding-page-0"
    file: 01_onboarding_to_editor.yaml

# Navigate to Settings via the gear icon in the editor header.
- tapOn:
    id: "settings-button"
- assertVisible: "Settings"

# ---- Open the sheet (formSheet route navigation) ----
- tapOn:
    id: "how-it-works-row"

# The formSheet animation takes ~300ms on iOS. Wait until the title
# inside the sheet content is reachable.
- extendedWaitUntil:
    visible: "How PasteClean works"
    timeout: 3000

# Step body should render in the formSheet's ScrollView.
- assertVisible: "Inlines all CSS"

- takeScreenshot: how-it-works-open

# ---- Gesture coverage 1: scroll inside the sheet body ----
# This is the gesture that crashed the gorhom implementation
# (reanimated worklet throwing during scroll). With the native
# formSheet, scrolling inside the ScrollView is pure UIKit; no JS
# in the gesture path.
- swipe:
    from:
      id: "how-it-works-scroll"
    direction: UP
    duration: 400

- waitForAnimationToEnd:
    timeout: 1000

# After scrolling, the last step should be reachable.
- assertVisible: "Cleans up"

# ---- Gesture coverage 2: swipe down to dismiss ----
# Native iOS formSheet dismisses via drag on the Sheet Grabber. UIKit
# only honors the dismiss gesture on the grabber + the few px of inset
# above the sheet's content; swiping anywhere lower scrolls the inner
# ScrollView instead. Use the Sheet Grabber as the swipe origin.
- swipe:
    from:
      text: "Sheet Grabber"
    direction: DOWN
    duration: 600

- waitForAnimationToEnd:
    timeout: 1500

# Sheet should be dismissed — Settings is visible again, sheet
# content is not.
- assertVisible: "Settings"
- assertNotVisible: "How PasteClean works"

# (X button removed — iOS sheets dismiss by drag, same as Apple Mail
# compose / Reminders. Swipe-down on the grabber is the only dismiss
# path, asserted above.)
